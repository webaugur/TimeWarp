site_name: TimeWarp
repo_url: https://github.com/webaugur/TimeWarp
edit_uri: ""
docs_dir: build/docs-src
site_dir: build/site
theme:
  name: material
  features: [navigation.sections, navigation.top, search.highlight, toc.follow]
  palette:
    - scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
plugins: [search]
markdown_extensions: [admonition, tables, attr_list, toc: {permalink: true}, pymdownx.superfences]
nav:
  - Manual: index.md
  - Downloads (GitHub Releases): https://github.com/webaugur/TimeWarp/releases/latest
