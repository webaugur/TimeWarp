name: portable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[portable]"
      - name: Freeze
        run: python -m PyInstaller --noconfirm --clean timewarp.spec
      - name: Smoke
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          if [[ -f dist/timewarp/timewarp.exe ]]; then
            TW=dist/timewarp/timewarp.exe
          else
            TW=dist/timewarp/timewarp
            chmod +x "$TW"
          fi
          "$TW" --version
          "$TW" weekday 2026-07-04
          "$TW" sun --city "New York" --no-color 2026-07-04
          "$TW" cities > cities.out
          "$TW" holidays 2026 --country US --no-color > holidays.out
          test -s cities.out
          test -s holidays.out
      - name: Zip
        shell: bash
        run: |
          VER=$(python -c "from timewarp import __version__; print(__version__)")
          NAME="timewarp-${VER}-${{ matrix.artifact }}"
          mkdir -p dist/upload
          if command -v zip >/dev/null 2>&1; then
            (cd dist && zip -r "upload/${NAME}.zip" timewarp)
          else
            powershell -NoProfile -Command "Compress-Archive -Path dist/timewarp -DestinationPath dist/upload/${NAME}.zip"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: timewarp-${{ matrix.artifact }}
          path: dist/upload/*.zip
