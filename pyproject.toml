[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timewarp"
version = "0.1.0"
description = "Local date calculators and sky almanac: durations, holidays, sun/moon/planets, SBDB bodies, and satellite passes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TimeWarp" }]
dependencies = ["sgp4>=2.23", "holidays>=0.50"]

[project.scripts]
timewarp = "timewarp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
