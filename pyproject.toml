[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timewarp"
version = "1.2.0"
description = "Local date calculators and sky almanac: durations, holidays, sun/moon/planets, SBDB bodies, and satellite passes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "David L Norris", email = "dave@webaugur.com" }]
dependencies = ["sgp4>=2.23", "holidays>=0.50", "rich>=13.7", "tzdata>=2024.1"]

[project.optional-dependencies]
portable = ["pyinstaller>=6.0"]

[project.scripts]
timewarp = "timewarp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
