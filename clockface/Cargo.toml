[package]
name = "clockface"
version = "0.1.0"
edition = "2021"
publish = false
description = "Roman-numeral grandfather-clock kiosk (eframe/egui glow, optional KMS via eboard)."
license = "MIT"

# glow (OpenGL / GLES) is the desktop and KMS renderer. wgpu is not enabled.
[features]
default = ["desktop"]
# X11 / Wayland window via eframe and winit.
desktop = ["dep:eframe"]
# Direct display on Linux: DRM/KMS + GBM + EGL, then linuxfb. No X11 or Wayland.
# The feature is a no-op on other operating systems so those builds still compile.
kms = ["eboard"]

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37", default-features = true }
png = "=0.17.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
resvg = "0.45"
tiny-skia = "0.11"
usvg = "0.45"

[target.'cfg(target_os = "linux")'.dependencies]
# auto tries KMS then linuxfb. viv-fb is i.MX6, not the Pi, so it stays off.
eboard = { version = "0.3", optional = true, default-features = false, features = ["kms", "linuxfb", "input-evdev", "default_fonts"] }
