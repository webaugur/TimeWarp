[package]
name = "clockface"
version = "0.1.0"
edition = "2021"
publish = false
description = "Roman-numeral grandfather-clock face for a Raspberry Pi kiosk (eframe/egui, glow)."
license = "MIT"

# glow (OpenGL / GLES via glutin) is the Pi backend. wgpu is intentionally
# not enabled: it is a much heavier stack and a poor fit for Raspberry Pi GLES.
[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "=0.31.1", default-features = true }
png = "=0.17.16"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
