# Default scenery theme. Clockface reads this file and shows or hides the
# matching groups in scene.svg. A new folder with the same keys and its own
# SVG needs no Rust change. See ../CREATING_A_THEME.md.

name = "default"

# Semicircle. The circle's center is the bottom-middle of this box (500, 500)
# and the radius is 500. Sky is the top of the box; ground is the bottom edge.
view_box = [0.0, 0.0, 1000.0, 500.0]

# Drawn in every season, at every hour, in every weather.
always = ["tree-trunk"]

[sky]
day = "sky-clear"
overcast = "sky-overcast"
twilight = "tint-dusk"
night = "sky-night"

# Real photographs. Rain, snow, storm, and fog use the overcast plate,
# with the vector precipitation drawn on top. Dawn and dusk are tints.
[photos]
clear = "sky-clear"
partly = "sky-partly"
overcast = "sky-overcast"
night = "sky-night"
dawn = "tint-dawn"
dusk = "tint-dusk"

[season.leaves]
spring = "leaves-spring"
summer = "leaves-summer"
autumn = "leaves-autumn"
winter = "leaves-winter"

[season.ground]
spring = "ground-spring"
summer = "ground-summer"
autumn = "ground-autumn"
winter = "ground-winter"

# Precipitation stays vector, drawn over the photograph.
[weather]
rain = ["rain"]
snow = ["snow", "snow-cover"]
storm = ["storm"]
fog = ["fog"]

# The shipped theme draws no sun. The upper-left quarter is the NOAA disc.
[time]
day = []
twilight = []
night = []

hide_sun = ["storm", "fog"]
