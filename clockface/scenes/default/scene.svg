<?xml version="1.0" encoding="UTF-8"?>
<!--
  Default clockface horizon. Semicircle: center (500, 500), radius 500.
  Sky is toward the top of this box (the 9–3 line); ground is toward the bottom (6 o'clock).
  Each toggleable piece is a group whose id is listed in theme.toml.
  Do not draw a sun or a moon. Those discs are the upper quarters.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="grad-dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb070" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ffb070" stop-opacity="0.05"/>
      <stop offset="0.62" stop-color="#ff9a55" stop-opacity="0.16"/>
      <stop offset="0.82" stop-color="#ff8840" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffd0a0" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="grad-dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1848" stop-opacity="0.10"/>
      <stop offset="0.30" stop-color="#6a3058" stop-opacity="0.16"/>
      <stop offset="0.58" stop-color="#c45a40" stop-opacity="0.22"/>
      <stop offset="0.80" stop-color="#e8944e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f3c898" stop-opacity="0.36"/>
    </linearGradient>
    <linearGradient id="grad-fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7ecee" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#d5dcde" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#eef1f2" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="grad-hill-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ea4b4"/>
      <stop offset="1" stop-color="#6d8494"/>
    </linearGradient>
    <linearGradient id="grad-hill-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e7380"/>
      <stop offset="1" stop-color="#3e515c"/>
    </linearGradient>
  </defs>

  <!-- Photographs sit under the vector land. One of these groups is shown. -->
  <g id="sky-clear">
    <image href="skies/clear.jpg" x="0" y="0" width="1000" height="500" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g id="sky-partly">
    <image href="skies/partly.jpg" x="0" y="0" width="1000" height="500" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g id="sky-overcast">
    <image href="skies/over.jpg" x="0" y="0" width="1000" height="500" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g id="sky-night">
    <image href="skies/night.jpg" x="0" y="0" width="1000" height="500" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g id="tint-dawn">
    <rect width="1000" height="500" fill="url(#grad-dawn)"/>
  </g>
  <g id="tint-dusk">
    <rect width="1000" height="500" fill="url(#grad-dusk)"/>
  </g>

  <g id="storm">
    <polyline points="500,150 482,196 508,196 474,250" fill="none" stroke="#ffe7a0" stroke-width="1.4" stroke-linejoin="round" opacity="0.8"/>
  </g>

  <g id="land">
    <path fill="url(#grad-hill-far)" d="M 0 165 C 70 125 130 113 200 131 C 280 151 320 95 410 113 C 500 131 540 85 630 111 C 720 137 780 105 860 125 C 930 141 970 155 1000 151 L 1000 500 L 0 500 Z"/>
    <path fill="url(#grad-hill-near)" d="M 0 205 C 90 175 150 187 230 183 C 320 177 360 155 450 173 C 540 191 600 165 690 181 C 780 197 860 175 940 189 C 970 195 990 201 1000 199 L 1000 500 L 0 500 Z"/>
  </g>

