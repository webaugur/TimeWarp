<?xml version="1.0" encoding="UTF-8"?>
<!--
  Default clockface horizon. Upper half of a circle: center (500, 500), radius 500.
  Each toggleable piece is a group whose id is listed in theme.toml.
  Leave the sky around (699, 301) reasonably open; the app paints the moon there.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="grad-day" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a568f"/>
      <stop offset="0.42" stop-color="#5d8fbe"/>
      <stop offset="0.72" stop-color="#9ec0d6"/>
      <stop offset="0.9" stop-color="#e7d3b4"/>
      <stop offset="1" stop-color="#f3e6cf"/>
    </linearGradient>
    <linearGradient id="grad-twilight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2348"/>
      <stop offset="0.45" stop-color="#6a3a58"/>
      <stop offset="0.78" stop-color="#e07a45"/>
      <stop offset="1" stop-color="#f2c9a0"/>
    </linearGradient>
    <linearGradient id="grad-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#141c36"/>
      <stop offset="1" stop-color="#24324a"/>
    </linearGradient>
    <radialGradient id="grad-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d4"/>
      <stop offset="0.35" stop-color="#ffd56a"/>
      <stop offset="0.7" stop-color="#ffb14a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffb14a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad-fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7ecee" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#d5dcde" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#eef1f2" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="grad-hill-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ea4b4"/>
      <stop offset="1" stop-color="#6d8494"/>
    </linearGradient>
    <linearGradient id="grad-hill-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e7380"/>
      <stop offset="1" stop-color="#3e515c"/>
    </linearGradient>
  </defs>

  <g id="sky-night">
    <rect width="1000" height="500" fill="url(#grad-night)"/>
  </g>
  <g id="sky-twilight">
    <rect width="1000" height="500" fill="url(#grad-twilight)"/>
  </g>
  <g id="sky-day">
