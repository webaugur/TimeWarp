<!--
  Wheel mural. ViewBox center (500,500) is the clock shaft.
  Face radius 1 is 353.6 px. The dial covers everything inside that.
  Only the band from about 1.02 to 1.41 face radii can show in a window.
  A motif drawn at clock angle A (clockwise from 12) is in the window center
  when the wheel's fraction equals (A - window_center) / 360.
  Year window center is 225°. Day window center is 135°.
  Replace this file to replace the art. Groups are labeled by what they depict.
-->
